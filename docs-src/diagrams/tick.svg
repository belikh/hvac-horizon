<svg viewBox="0 0 720 206" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <marker id="to" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1.5 1.5 L7.5 4.5 L1.5 7.5"/></marker>
    <marker id="acc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" stroke="var(--jp-accent)"/></marker>
  </defs>
  <rect x="10" y="8" width="160" height="52"/>
  <text x="24" y="29" font-size="14" font-weight="700">1 Read</text>
  <text x="24" y="48" font-size="13" fill="var(--jp-text-muted)">the sensors</text>
  <path d="M170 34 H188" marker-end="url(#to)"/>
  <rect x="190" y="8" width="160" height="52"/>
  <text x="204" y="29" font-size="14" font-weight="700">2 Store</text>
  <text x="204" y="48" font-size="13" fill="var(--jp-text-muted)">one reading</text>
  <path d="M350 34 H368" marker-end="url(#to)"/>
  <rect x="370" y="8" width="160" height="52"/>
  <text x="384" y="29" font-size="14" font-weight="700">3 Refit</text>
  <text x="384" y="48" font-size="13" fill="var(--jp-text-muted)">every 12 readings</text>
  <path d="M530 34 H548" marker-end="url(#to)"/>
  <rect x="550" y="8" width="160" height="52"/>
  <text x="564" y="29" font-size="14" font-weight="700">4 Forecast</text>
  <text x="564" y="48" font-size="13" fill="var(--jp-text-muted)">min, kWh, cost</text>
  <rect x="10" y="104" width="160" height="52"/>
  <text x="24" y="125" font-size="14" font-weight="700">5 Targets</text>
  <text x="24" y="144" font-size="13" fill="var(--jp-text-muted)">preset, price</text>
  <path d="M170 130 H188" marker-end="url(#to)"/>
  <rect x="190" y="104" width="160" height="52"/>
  <text x="204" y="125" font-size="14" font-weight="700">6 Decide</text>
  <text x="204" y="144" font-size="13" fill="var(--jp-text-muted)">AC and heater</text>
  <path d="M350 130 H368" marker-end="url(#to)"/>
  <rect x="370" y="104" width="160" height="52" stroke="var(--jp-accent)"/>
  <text x="384" y="125" font-size="14" font-weight="700">7 Drive</text>
  <text x="384" y="144" font-size="13" fill="var(--jp-text-muted)">with control on</text>
  <path d="M530 130 H548" marker-end="url(#to)"/>
  <rect x="550" y="104" width="160" height="52"/>
  <text x="564" y="125" font-size="14" font-weight="700">8 Publish</text>
  <text x="564" y="144" font-size="13" fill="var(--jp-text-muted)">to the sensors</text>
  <path d="M630 60 V82 H90 V102" marker-end="url(#to)"/>
  <text x="10" y="190" font-size="13" fill="var(--jp-text-muted)">One tick runs every 5 minutes. Step 7 sends commands only with control on.</text>
</svg>
