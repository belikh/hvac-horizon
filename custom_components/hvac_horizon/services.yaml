set_lock:
  name: Set lock
  description: Lock control so no commands are sent, or unlock it. Unlocking needs the configured PIN.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    locked:
      name: Locked
      required: true
      selector:
        boolean:
    pin:
      name: PIN
      selector:
        text:
          type: password
export_csv:
  name: Export CSV
  description: Return the stored readings as CSV text, in the layout the backfill tool reads.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
reset_learning:
  name: Reset learning
  description: Forget the stored samples and the fitted model for an HVAC Horizon entry.
  fields:
    entry_id:
      name: Entry
      description: The HVAC Horizon entry to reset.
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
export_samples:
  name: Export samples
  description: Return the stored readings for an HVAC Horizon entry.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
start_autotune:
  name: Start auto-tune
  description: Start a relay test at a setpoint. It switches the heater plug on and off. Do not use while the AC is under test.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    setpoint:
      name: Setpoint
      required: true
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
what_if:
  name: What-if forecast
  description: Forecast minutes, energy and cost to a target for given conditions, using the current model and price slots.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    room_c:
      name: Room temperature
      required: true
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
    target_c:
      name: Target
      required: true
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
    outdoor_c:
      name: Outdoor temperature
      required: true
      selector:
        number:
          min: -20
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
    power_kw:
      name: AC power
      required: true
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          unit_of_measurement: kW
start_timed_preset:
  name: Start timed preset
  description: Use a preset's setpoint for a set number of minutes, then return to the normal preset.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    preset:
      name: Preset
      required: true
      selector:
        select:
          options:
            - comfort
            - eco
            - boost
            - away
    minutes:
      name: Minutes
      required: true
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min

respond_suggestion:
  name: Respond to learning suggestion
  description: Accept the learned heat gain as the new baseline, or dismiss the current suggestion until the gain changes again.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    accept:
      name: Accept
      required: true
      selector:
        boolean:
