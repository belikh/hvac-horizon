set_lock:
  name: Set lock
  description: Lock control so no commands are sent, or unlock it. Unlocking needs the configured PIN.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    locked:
      name: Locked
      required: true
      selector:
        boolean:
    pin:
      name: PIN
      selector:
        text:
          type: password
set_house_mode:
  name: Set house mode
  description: Set home or away for every HVAC Horizon room. Away makes each room use its away setpoint.
  fields:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - home
            - away
export_csv:
  name: Export CSV
  description: Return the stored readings as CSV text, in the layout the backfill tool reads.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
reset_learning:
  name: Reset learning
  description: Forget the stored samples and the fitted model for an HVAC Horizon entry.
  fields:
    entry_id:
      name: Entry
      description: The HVAC Horizon entry to reset.
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
export_samples:
  name: Export samples
  description: Return the stored readings for an HVAC Horizon entry.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
start_autotune:
  name: Start auto-tune
  description: Start a relay test at a setpoint. It switches the heater plug on and off, obeys the heat-on threshold and the AC cooling cutoff, and ends after 120 minutes. The setpoint must be at least 2 K above the room. Do not use while the AC is under test.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    setpoint:
      name: Setpoint
      required: true
      selector:
        number:
          min: 15
          max: 26
          step: 0.5
          unit_of_measurement: "°C"
cancel_autotune:
  name: Cancel auto-tune
  description: End a running relay test and turn the heater off.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
what_if:
  name: What-if forecast
  description: Forecast minutes, energy and cost to a target for given conditions, using the current model and price slots.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    room_c:
      name: Room temperature
      required: true
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
    target_c:
      name: Target
      required: true
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
    outdoor_c:
      name: Outdoor temperature
      required: true
      selector:
        number:
          min: -20
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
    power_kw:
      name: AC power
      required: true
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          unit_of_measurement: kW
start_timed_preset:
  name: Start timed preset
  description: Use a preset's setpoint for a set number of minutes, then return to the normal preset.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    preset:
      name: Preset
      required: true
      selector:
        select:
          options:
            - comfort
            - eco
            - boost
            - away
    minutes:
      name: Minutes
      required: true
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min

respond_suggestion:
  name: Respond to learning suggestion
  description: Accept the learned heat gain as the new baseline, or dismiss the current suggestion until the gain changes again.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    accept:
      name: Accept
      required: true
      selector:
        boolean:

generate_investigation_report:
  name: Generate investigation report
  description: Build a report on the AC from the last 24 hours of readings. Uses the conversation agent when one is set and the daily model budget allows; otherwise stores the rule-based report.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
