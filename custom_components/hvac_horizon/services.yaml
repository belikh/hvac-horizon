reset_learning:
  name: Reset learning
  description: Forget the stored samples and the fitted model for an HVAC Horizon entry.
  fields:
    entry_id:
      name: Entry
      description: The HVAC Horizon entry to reset.
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
export_samples:
  name: Export samples
  description: Return the stored readings for an HVAC Horizon entry.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
start_autotune:
  name: Start auto-tune
  description: Start a relay test at a setpoint. It switches the heater plug on and off. Do not use while the AC is under test.
  fields:
    entry_id:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: hvac_horizon
    setpoint:
      name: Setpoint
      required: true
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
