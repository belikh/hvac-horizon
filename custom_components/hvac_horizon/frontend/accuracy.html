<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVAC Horizon accuracy</title>
<style>
  :root { --fg: #1c1c1e; --muted: #5f6368; --bg: #ffffff; --line: #d0d4da; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #e8eaed; --muted: #9aa0a6; --bg: #1c1c1e; --line: #3c4043; }
  }
  :root[data-theme="dark"] { --fg: #e8eaed; --muted: #9aa0a6; --bg: #1c1c1e; --line: #3c4043; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; max-width: 640px; margin-top: 12px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<h1>Forecast accuracy</h1>
<p class="muted" id="status">Loading.</p>
<p>Median absolute error: <strong id="median">-</strong> min</p>
<table>
  <thead><tr><th>Run</th><th>Predicted, min</th><th>Measured, min</th><th>Error, min</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
(function () {
  "use strict";
  var status = document.getElementById("status");
  var entryId = new URLSearchParams(window.location.search).get("entry_id");

  function accessToken() {
    // The Home Assistant frontend keeps the sign-in tokens in localStorage under hassTokens. Read them in a try block.
    try {
      var stored = window.localStorage.getItem("hassTokens");
      var tokens = stored ? JSON.parse(stored) : null;
      return tokens && tokens.access_token ? tokens.access_token : null;
    } catch (e) {
      return null;
    }
  }

  function fail(message) {
    status.textContent = message;
  }

  function cell(row, text) {
    var td = document.createElement("td");
    td.textContent = text;
    row.appendChild(td);
  }

  function render(body) {
    status.textContent = body.accuracy_pairs.length ? "Last " + body.accuracy_pairs.length + " backtest runs, oldest first." : "No backtest runs yet.";
    document.getElementById("median").textContent = body.median_abs_error_min === null ? "-" : Number(body.median_abs_error_min).toFixed(1);
    var rows = document.getElementById("rows");
    body.accuracy_pairs.forEach(function (pair, index) {
      var row = document.createElement("tr");
      cell(row, String(index + 1));
      cell(row, Number(pair.predicted_min).toFixed(1));
      cell(row, Number(pair.measured_min).toFixed(1));
      cell(row, Number(pair.error_min).toFixed(1));
      rows.appendChild(row);
    });
  }

  if (!entryId) {
    fail("Add ?entry_id= with the config entry id to the address.");
    return;
  }
  var token = accessToken();
  if (!token) {
    fail("Sign in to Home Assistant in this browser, then reload this page.");
    return;
  }
  fetch("/api/hvac_horizon/accuracy/" + encodeURIComponent(entryId), { headers: { Authorization: "Bearer " + token } })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(render)
    .catch(function (error) {
      fail("Could not load the accuracy data (" + error.message + ").");
    });
})();
</script>
</body>
</html>
